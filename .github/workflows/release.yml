name: release

# Build release archives when a version tag is pushed, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # allow a manual run (builds artifacts, no release)
    inputs:
      version:
        description: 'Version label for a manual build (e.g. v0.0.0-test)'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Sanity checks
        run: |
          go vet ./...
          go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          TOOLS="891flash ft891flash ft891patch ft891customlogo"

          build() {
            os=$1; arch=$2; ext=$3
            name="891flash-${VERSION}-${os}-${arch}"
            stage="dist/${name}"
            mkdir -p "$stage/patches" "$stage/docs"
            for t in $TOOLS; do
              echo "  $name: $t"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w" -o "$stage/${t}${ext}" "./cmd/$t"
            done
            cp patches/*.json "$stage/patches/"
            cp patches/README.md "$stage/patches/"
            cp docs/QUICKSTART.md "$stage/README.md"
            cp docs/CREATING_A_PATCH.md docs/CAVE_ALLOCATION.md docs/cave_main.tsv docs/cave_panel.tsv "$stage/docs/"
            cp LICENSE "$stage/"
            ( cd dist && zip -qr "${name}.zip" "${name}" && rm -rf "${name}" )
          }

          build linux   amd64 ""      # PC / server
          build linux   arm64 ""      # Raspberry Pi
          build windows amd64 ".exe"
          build darwin  arm64 ""      # Apple Silicon

          ( cd dist && sha256sum *.zip > SHA256SUMS.txt )
          echo "--- artifacts ---"; ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 891flash-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip dist/SHA256SUMS.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes
